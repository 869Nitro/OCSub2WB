name: Windows build and release draft

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run offline Python tests
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Record MinGW versions
        shell: msys2 {0}
        run: |
          pacman -Q | awk '/^mingw-w64-x86_64-(gcc|gcc-libs|cc-libs|libgcc|libstdc[+][+]|crt|crt-git|winpthreads|libwinpthread) /'
          g++ -dumpfullversion

      - name: Add MinGW to PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:MSYS2_LOCATION 'mingw64\bin')

      - name: Build control panel
        shell: cmd
        run: panel\build.bat --ci

      - name: Verify and package
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $format = & objdump -f OCSub2WB.exe
          if ($LASTEXITCODE -ne 0 -or ($format -join ' ') -notmatch 'pei-x86-64') {
            throw 'Expected a Windows x64 EXE'
          }
          $imports = & objdump -p OCSub2WB.exe | Select-String 'DLL Name:'
          if ($LASTEXITCODE -ne 0 -or ($imports -join ' ') -match 'DLL Name:\s*(libgcc|libstdc\+\+|libwinpthread)') {
            throw 'Unable to verify static MinGW runtime linkage'
          }
          $imports | ForEach-Object { $_.Line.Trim() }

          $package = 'dist\OCSub2WB'
          [IO.Directory]::CreateDirectory("$package\assets") | Out-Null
          Copy-Item -LiteralPath OCSub2WB.exe,opencode-go-proxy.py,ocgo_common.py,README.md,LICENSE,THIRD-PARTY-NOTICES.md,.env.example -Destination $package
          Copy-Item -LiteralPath assets\icon.png -Destination "$package\assets"
          if (Test-Path -LiteralPath 'assets\panel.png') {
            Copy-Item -LiteralPath assets\panel.png -Destination "$package\assets"
          }
          Copy-Item -LiteralPath licenses -Destination $package -Recurse

          $msysLicenses = Join-Path $env:MSYS2_LOCATION 'mingw64\share\licenses'
          $installed = @{
            'MinGW-w64-COPYING.txt' = 'crt\COPYING'
            'MinGW-w64-headers-notices.txt' = 'crt\COPYING.MinGW-w64.txt'
            'MinGW-w64-runtime-notices.txt' = 'crt\COPYING.MinGW-w64-runtime.txt'
            'winpthreads-COPYING.txt' = 'winpthreads\COPYING'
          }
          foreach ($name in $installed.Keys) {
            Copy-Item -LiteralPath (Join-Path $msysLicenses $installed[$name]) -Destination "$package\licenses\$name"
          }

          $version = 'dev'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
            if ($version -notmatch '^v[0-9][A-Za-z0-9._+-]*$') { throw 'Invalid release tag' }
            $appVersion = & python -B -c 'from ocgo_common import VERSION; print(VERSION)'
            if ($LASTEXITCODE -ne 0 -or $version -ne "v$appVersion") {
              throw 'Release tag does not match the application version'
            }
          }
          $zip = "OCSub2WB-$version-win64.zip"
          Compress-Archive -LiteralPath $package -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "OCSUB2WB_ZIP=$zip"

      - name: Test the unpacked panel
        shell: pwsh
        run: ./tests/smoke_panel.ps1 -Zip $env:OCSUB2WB_ZIP -ScreenshotPath (Join-Path $env:RUNNER_TEMP 'panel-preview.png')

      - uses: actions/upload-artifact@v4
        with:
          name: OCSub2WB-build
          path: |
            ${{ env.OCSUB2WB_ZIP }}
            ${{ env.OCSUB2WB_ZIP }}.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: panel-preview
          path: ${{ runner.temp }}/panel-preview.png
          if-no-files-found: ignore
          retention-days: 7

  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: OCSub2WB-build

      - name: Create or update the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "OCSub2WB-$tag-win64.zip"
          $expected = ((Get-Content -LiteralPath "$zip.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) {
            throw 'Release asset SHA-256 does not match'
          }
          $release = gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $releaseInfo = $release | ConvertFrom-Json
            if (!$releaseInfo.isDraft) {
              $assets = @($releaseInfo.assets | ForEach-Object { $_.name })
              if ($zip -notin $assets -or "$zip.sha256" -notin $assets) {
                throw 'The published release is missing its Windows assets'
              }
              Write-Host 'The published release already has its Windows assets'
              exit 0
            }
            gh release upload $tag $zip "$zip.sha256" --clobber
          } else {
            gh release create $tag $zip "$zip.sha256" --verify-tag --draft --title $tag --notes-from-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
